services:
  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      bash -c "pip install -r backend/requirements.txt
      && python scripts/generate_sample_data.py
      && cd backend && alembic upgrade head
      && AI_PROVIDER=mock uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: mock
      EMAIL_PROVIDER: mock
      GRAPH_ENABLED: "false"
      DATABASE_URL: sqlite:////app/data/app.db
      LDAP_USERS_PATH: data/sample/ldap_users.xlsx
      GAC_USERS_PATH: data/sample/gac_users.xlsx
      LDAP_COMPANIES_PATH: data/sample/ldap_companies.xlsx
      TEAMS_CALLBACK_SECRET: dev-teams-callback-secret

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
    depends_on:
      - api
